<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <title>Download dubbed movie — BhashaFlix AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b35'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%230a0b10'%3EB%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="download">
  <header class="top"><div class="wrap top-inner" id="topbar"></div></header>

  <main class="wrap">
    <section class="hero" style="padding-bottom:0">
      <div class="row between">
        <div>
          <h1 data-i18n="download.title">Download your dub</h1>
          <p class="lede" data-i18n="download.lede">The video stream in every file is the original.</p>
        </div>
        <select id="job-picker" style="max-width:260px"></select>
      </div>
    </section>

    <section id="empty-card" class="card" style="margin-top:16px">
      <p data-i18n="download.notReady">Nothing is ready to download yet.</p>
      <a class="btn primary" href="/upload.html" data-i18n="nav.upload">Upload</a>
    </section>

    <div id="download-wrap" class="hidden">
      <section class="card" style="margin-top:16px">
        <div class="row between">
          <div>
            <div style="font-weight:750" id="dl-title">—</div>
            <div class="tiny muted" id="dl-meta">—</div>
          </div>
          <span class="badge ok" id="dl-badge">video copied</span>
        </div>
        <div id="dl-items" class="stack" style="margin-top:14px"></div>
      </section>
      <section class="card" style="margin-top:14px">
        <h3 data-i18n="status.verification">Original video verification</h3>
        <div id="dl-verify" class="stack tiny"></div>
      </section>
      <div class="pill-note" style="margin-top:14px">
        <span id="retention-note"></span>
      </div>
    </div>
  </main>

  <nav class="bottom" id="bottomnav"></nav>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/page-download.js"></script>
</body>
</html>
