<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <title>AI Dubbing Studio — BhashaFlix AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b35'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%230a0b10'%3EB%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="studio">
  <header class="top"><div class="wrap top-inner" id="topbar"></div></header>

  <main class="wrap">
    <section class="hero" style="padding-bottom:0">
      <div class="row between">
        <div>
          <h1 data-i18n="studio.title">AI Dubbing Studio</h1>
          <p class="lede" data-i18n="studio.lede">Correct the transcript, fix speakers, choose voices.</p>
        </div>
        <div class="row">
          <select id="job-picker" style="max-width:280px"></select>
          <a class="btn sm" href="/upload.html" data-i18n="nav.upload">Upload</a>
        </div>
      </div>
    </section>

    <section class="card" id="empty-card" style="margin-top:16px">
      <p data-i18n="studio.noJob">No project selected.</p>
    </section>

    <div id="studio" class="hidden">
      <section class="card" style="margin-top:16px">
        <div class="row between">
          <div>
            <div style="font-weight:750" id="studio-job-name">—</div>
            <div class="tiny muted" id="studio-job-meta">—</div>
          </div>
          <span class="badge" id="studio-badge">—</span>
        </div>
        <div class="bar" style="margin-top:12px"><i id="studio-progress"></i></div>
        <div class="row" style="margin-top:14px">
          <button class="btn sm" data-run="transcribe" data-i18n="studio.runTranscribe">Transcribe</button>
          <button class="btn sm" data-run="speakers" data-i18n="studio.runSpeakers">Identify speakers</button>
          <button class="btn sm" data-run="translate" data-i18n="studio.runTranslate">Translate</button>
          <button class="btn sm" data-run="generate-voice" data-i18n="studio.runVoices">Generate voices</button>
          <button class="btn sm primary" data-run="render" data-i18n="studio.runRender">Synchronize &amp; render</button>
        </div>
        <p class="tiny muted" style="margin:10px 0 0" data-i18n="studio.honest">Addressing errors here is faster than re-running the whole job.</p>
      </section>

      <div id="notices" class="stack" style="margin-top:14px"></div>

      <section class="card" style="margin-top:14px">
        <div class="row between">
          <h2 style="margin:0" data-i18n="studio.speakers">Speakers</h2>
          <span class="tiny muted" id="speaker-count"></span>
        </div>
        <div id="speakers" class="stack" style="margin-top:12px"></div>
      </section>

      <section class="card" style="margin-top:14px">
        <div class="row between">
          <h2 style="margin:0" data-i18n="studio.dialogue">Dialogue</h2>
          <div class="row">
            <span class="tiny muted" id="line-count"></span>
            <button class="btn sm" id="load-subtitles" data-i18n="studio.loadVtt">Import subtitles</button>
            <button class="btn sm primary" id="save-dialogue" data-i18n="studio.saveAll">Save dialogue</button>
          </div>
        </div>
        <input type="file" id="sub-import" accept=".srt,.vtt" class="sr-only" />
        <div id="segments" class="seg-list" style="margin-top:14px"></div>
      </section>
    </div>
  </main>

  <nav class="bottom" id="bottomnav"></nav>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/page-studio.js"></script>
</body>
</html>
